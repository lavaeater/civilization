#:schema https://dystroy.org/bacon/.bacon.schema.json

# This is a configuration file for the bacon tool
#
# Complete help on configuration: https://dystroy.org/bacon/config/
#
# You may check the current default at
#   https://github.com/Canop/bacon/blob/main/defaults/default-bacon.toml

default_job = "clippy"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check"]
need_stdout = false

[jobs.clippy]
command = [
    "cargo", "+nightly", "clippy",
    "-Z", "codegen-backend",
    "--timings"
]
need_stdout = true

[jobs.clippy.env]
CARGO_PROFILE_DEV_CODEGEN_BACKEND = "cranelift"  # Dynamically assigns cranelift to dev builds
RUSTC_WRAPPER = "sccache"

# Same as `clippy`, but also lints tests, examples and benches — the default
# `clippy` job only sees the lib and bin targets.
[jobs.clippy-all]
command = [
    "cargo", "+nightly", "clippy",
    "-Z", "codegen-backend",
    "--all-targets",
]
need_stdout = true

[jobs.clippy-all.env]
CARGO_PROFILE_DEV_CODEGEN_BACKEND = "cranelift"
RUSTC_WRAPPER = "sccache"

# [jobs.nextest]
# command = [
#     "cargo", "+nightly", "nextest", "run",
#     "-Z", "codegen-backend",
#     "--timings"
# ]
# need_stdout = true
# analyzer = "nextest"

# [jobs.nextest.env]
# CARGO_PROFILE_DEV_CODEGEN_BACKEND = "cranelift"  # Dynamically assigns cranelift to dev builds
# RUSTC_WRAPPER = "sccache"

[jobs.nextest]
command = [
    "cargo", "nextest", "run",
    "--timings"
]
need_stdout = true
analyzer = "nextest"

[jobs.nextest.env]
RUSTC_WRAPPER = "sccache"

[jobs.tarp]
 command = [
     "cargo", "+nightly", "tarpaulin", "--skip-clean"#,
#     "-Z", "codegen-backend"
]
need_stdout = true
analyzer = "nextest"

[jobs.tarp.env]
#CARGO_PROFILE_DEV_CODEGEN_BACKEND = "cranelift"  # Dynamically assigns cranelift to dev builds
RUSTC_WRAPPER = "sccache"

[jobs.doc]
command = ["cargo", "doc", "--no-deps"]
need_stdout = false

# If the doc compiles, then it opens in your browser and bacon switches
# to the previous job
[jobs.doc-open]
command = ["cargo", "doc", "--no-deps", "--open"]
need_stdout = false
on_success = "back" # so that we don't open the browser at each change

# You can run your application and have the result displayed in bacon,
# if it makes sense for this crate.
[jobs.run]
command = [
    "cargo", "run",
    # put launch parameters for your program behind a `--` separator
]
need_stdout = true
allow_warnings = true
background = true

# Run your long-running application (eg server) and have the result displayed in bacon.
# For programs that never stop (eg a server), `background` is set to false
# to have the cargo run output immediately displayed instead of waiting for
# program's end.
# 'on_change_strategy' is set to `kill_then_restart` to have your program restart
# on every change (an alternative would be to use the 'F5' key manually in bacon).
# If you often use this job, it makes sense to override the 'r' key by adding
# a binding `r = job:run-long` at the end of this file .
# A custom kill command such as the one suggested below is frequently needed to kill
# long running programs (uncomment it if you need it)
[jobs.run-long]
command = [
    "cargo", "run",
    # put launch parameters for your program behind a `--` separator
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
# kill = ["pkill", "-TERM", "-P"]

# This parameterized job runs the example of your choice, as soon
# as the code compiles.
# Call it as
#    bacon ex -- my-example
[jobs.ex]
command = ["cargo", "run", "--example"]
need_stdout = true
allow_warnings = true

# 1. Standard build, but with timings enabled
[jobs.build-timings]
command = [
    "cargo", "build",
    "--timings"
]
need_stdout = true

[keybindings]
# Remap 'c' or choose custom keys to trigger your profiling layouts on a whim
t = "job:tarp"
c = "job:clippy" # comment this to have 'c' run clippy on only the default target
a = "job:clippy-all" # clippy across lib, bins, tests and examples
v = "job:nextest"
