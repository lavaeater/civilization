[package]
name = "mobile"
version = "0.1.0"
edition = "2024"
publish = false

# Not a member of the parent civilization/ workspace (it depends on adv_civ
# via a path dependency, but is built and versioned independently). Without
# this, cargo-apk's build invocation errors with "current package believes
# it's in a workspace when it's not" -- plain `cargo check`/`clippy` don't
# hit this, but cargo-apk's does.
[workspace]

[lib]
name = "mobile"
crate-type = ["staticlib", "cdylib"]

[dependencies]
adv_civ = { path = ".." } # ToDo
bevy = { version = "0.19.0", default-features = false, features = ["android-native-activity"] }

[target."cfg(target_os = \"ios\")".dependencies]
objc2-avf-audio = { version = "0.3.0", features = [
    "AVAudioSession",
    "AVAudioSessionTypes",
] }

[package.metadata.android]
package = "me.nikl.bevygame"  # ToDo
apk_name = "BevyGame"  # ToDo same as GAME_OSX_APP_NAME in release workflow
assets = "../assets"
strip = "strip"
resources = "../build/android/res"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
target_sdk_version = 35

[package.metadata.android.application]
icon = "@mipmap/icon"
label = "Bevy Game" # ToDo
