[package]
name = "civ_lobby"
version = "0.1.0"
edition = "2024"
publish = false

# Supervisor for online games: creates games, spawns one adv_civ_server
# process per game and proxies /g/<code>/... to it.
# See docs/online-games-plan.md.

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "net", "sync", "fs"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
