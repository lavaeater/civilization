# Game server + Caddy TLS front (see docs/multiplayer.md).
#
#   docker compose up --build
#
# Caddy terminates TLS and proxies both the WebSocket game traffic and the
# HTTP join API on one port; the game server itself stays plain ws/http on
# the internal network. Set CIV_DOMAIN to a real domain for automatic
# Let's Encrypt certificates; unset, Caddy serves localhost with its
# internal CA.

services:
  game:
    # civ_lobby: players create games (2-9 players, any number human) and
    # share a code; one game server process per game.
    build:
      context: .
      target: lobby
    environment:
      # The address tokens are minted for = the address clients dial.
      PUBLIC_ADDR: ${CIV_DOMAIN:-localhost}:443
      # Each game's WebSocket is <PUBLIC_WS_BASE>/g/<code>/ws (through Caddy).
      PUBLIC_WS_BASE: wss://${CIV_DOMAIN:-localhost}
      PUBLIC_URL: https://${CIV_DOMAIN:-localhost}
      MAX_GAMES: ${MAX_GAMES:-10}
    volumes:
      - saves:/app/saves
    expose:
      - "8080"

  caddy:
    image: caddy:2
    ports:
      - "443:443"
      - "80:80"
    environment:
      CIV_DOMAIN: ${CIV_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The wasm client: run `trunk build --release` first.
      - ./dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - game

volumes:
  saves:
  caddy_data:
  caddy_config:
