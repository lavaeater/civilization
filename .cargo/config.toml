# Only project-specific build settings belong here. Machine-wide ones (the kache
# rustc wrapper) live in ~/.cargo/config.toml, and the toolchain is pinned by
# ~/projects/rust/bevy/rust-toolchain.toml.
#
# Keep native rustflags out of this file: kache folds every rustflag into its cache
# keys, so a flag here (a linker choice, -Zshare-generics, ...) makes every
# dependency miss the cache entries other Bevy projects built without it. Rust's
# default linker on x86_64 Linux is already lld.

# getrandom 0.3/0.4 need their wasm backend chosen by cfg; the matching
# `features = ["wasm_js"]` deps are in Cargo.toml. The Dockerfile writes this same
# section itself, because .dockerignore excludes .cargo/.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
