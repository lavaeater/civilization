[package]
name = "adv_civ_server"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "adv_civ_server"
path = "src/main.rs"

# Minimal interactive CLI client used to exercise the server over localhost.
# The real game client integration comes later; this proves the protocol.
[[bin]]
name = "spike_client"
path = "src/bin/spike_client.rs"

[dependencies]
adv_civ = { path = ".." }
adv_civ_protocol = { path = "../adv_civ_protocol", features = ["client", "server"] }
lava_ui_builder = { path = "../lava_ui_builder" }
tiny_http = "0.12"
serde_json = "1.0.145"
base64 = "0.22"
bevy = { version = "0.19.0", default-features = false, features = ["bevy_state", "bevy_log", "multi_threaded"] }
lightyear = { version = "0.29", default-features = false, features = [
    "std",
    "client",
    "server",
    "netcode",
    "websocket",
] }

[lints.clippy]
too_many_arguments = "allow"
